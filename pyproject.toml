[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "ha-unifi-protect-timeline"
version = "0.1.0"
description = "Backend timeline sensors for UniFi Protect events in Home Assistant"
requires-python = ">=3.13"
license = "MIT"
dependencies = []

[project.optional-dependencies]
test = [
  "pytest>=8.3",
  "ruff>=0.12",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py313"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
